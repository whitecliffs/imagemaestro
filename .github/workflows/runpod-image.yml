name: Build Runpod preview image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to this repository's GitHub Container Registry
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check cloud lifecycle and authentication
        run: python3 tests/test_runpod_cloud.py
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:runpod-preview" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.IMAGE }}
          cache-to: type=inline
