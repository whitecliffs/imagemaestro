name: Smoke-test Runpod image
on:
  workflow_dispatch:
    inputs:
      image:
        description: Published immutable image reference (ghcr.io/whitecliffs/imagemaestro@sha256:...)
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate published image reference
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"ghcr.io/whitecliffs/imagemaestro@sha256:[a-f0-9]{64}", os.environ["IMAGE"]), "Use this repository public image by digest"'
      - name: Boot image and check authentication
        env:
          IMAGE: ${{ inputs.image }}
        run: python3 scripts/smoke_runpod_image.py "$IMAGE"
